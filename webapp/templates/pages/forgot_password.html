{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="{% static 'css/editProfile.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #f5f5f5, #e1e1e1);
      font-family: 'Poppins', sans-serif;
    }

    .overlay3 {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
    }

    .wrapper3 {
      background: #fff;
      border-radius: 20px;
      padding: 40px 60px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.4s ease-in-out;
      position: relative;
    }

    .close3 a {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #222;
      transition: 0.3s;
    }

    .close3 a:hover {
      color: #ff4b5c;
    }

    .section-title h2 {
      font-size: 26px;
      color: #222;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #aaa;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    .btn-send {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-send:hover {
      background: #0056b3;
    }

    .message-text {
      margin-top: 15px;
      color: #333;
      font-size: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="overlay3">
    <div class="wrapper3">
      <div class="close3">
        <a href="{% url 'home' %}" title="Back to Home"><i class="fas fa-times"></i></a>
      </div>

      <div id="contact" class="contact-area section-padding">
        <div class="container">
          <center>
            <div class="section-title">
              <h2>Forgot Password</h2>
            </div>

            <div class="box-contact-form">
              <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                  <input
                    name="email"
                    type="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    required
                  >
                </div>

                <div class="Button">
                  <button class="btn-send" type="submit">Send Reset Link</button>
                </div>

                {% if message %}
                  <p class="message-text">{{ message }}</p>
                {% endif %}
              </form>
            </div>
          </center>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
