{% load static %}
<style>
  /* Full-page overlay */
  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #0F0F0F;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  /* Spinner */
  .spinner {
background-color: whitesmoke;
  background-image: url("{% static '/images/zsting.gif' %}");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 20vw; /* scales based on viewport width */
  width: 100%;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  }

    @media only screen and (max-width: 900px) {
        #preloader {
          background-size: 71%;
        }
      }

      @media only screen and (max-width: 650px) {
        #preloader {
          background-size: 81%;
        }
      }


  /* Hide content initially */
  body.loaded #loader {
    display: none;
  }
</style>
</head>

<div id="loader">
  <div class="spinner"></div>
</div>

<script>
  // Simulate page load
  window.addEventListener('load', function() {
    document.body.classList.add('loaded');
  });
</script>

</body>
</html>
